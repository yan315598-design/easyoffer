<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易offer · 网申侧栏</title>
  <link rel="icon" href="../icons/icon48.png">
  <script src="../scripts/theme-init.js"></script>
  <link rel="stylesheet" href="../fonts/app-ui.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../styles/brand.css">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="container">

    <!-- 顶部品牌 Header -->
    <header class="app-header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="" class="brand-logo">
        <div class="brand-text">
          <span class="brand-name"><span class="brand-en">易offer</span>网申填写助手</span>
          <span class="brand-sub">网申侧栏</span>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="themeToggle" class="icon-btn" title="切换深浅主题" aria-label="切换深浅主题">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="sidebar-command">
      <button type="button" id="captureJobBtn" class="btn btn-secondary">＋ 记录此岗位</button>
      <a href="../options/options.html#tracker" data-workspace-link class="footer-link">求职工作台 ↗</a>
    </div>

    <!-- 简历资料选择卡片 -->
    <section class="card profile-card">
      <span class="card-label">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        简历资料
      </span>

      <div class="profile-row">
        <div class="custom-dropdown" id="profileDropdown">
          <button type="button" class="dropdown-trigger" id="profileDropdownBtn" aria-expanded="false" aria-controls="profileDropdownMenu">
            <span class="profile-current-name" id="selectedProfileName">默认资料</span>
            <svg class="dropdown-arrow" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="dropdown-menu" id="profileDropdownMenu">
            <!-- 动态填充 -->
          </div>
          <!-- 隐式原生 select 用于底层逻辑兼容 -->
          <select id="profileSelect" style="display: none;"></select>
        </div>

        <button id="renameProfileBtn" class="icon-btn" title="重命名当前资料" aria-label="重命名当前资料">
          <svg viewBox="0 0 24 24" width="13.5" height="13.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        </button>
        <button id="addProfileBtn" class="icon-btn" title="新增资料" aria-label="新增资料">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>

      <!-- 简历完整度 -->
      <div class="completeness-block">
        <div class="completeness-info">
          <span class="completeness-label">简历完整度</span>
          <span id="completeness" class="completeness-val">0%</span>
        </div>
        <div class="progress-track">
          <div id="completenessBar" class="progress-fill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- 使用与投递速览：当前简历名已在上方下拉中展示，这里不再重复 -->
      <div class="profile-stats">
        <div class="stat">
          <span class="stat-label">求职方向</span>
          <span id="currentProfile" class="stat-value" title="">-</span>
        </div>
        <div class="stat">
          <span class="stat-label">上次使用</span>
          <span id="lastUsed" class="stat-value muted">-</span>
        </div>
      </div>
    </section>

    <!-- 资料速览（由 popup.js 动态插入 .profile-preview，收进上方资料卡片） -->

    <!-- 主要操作：页面连接状态与主填入动作同组 -->
    <section class="actions">
      <!-- 页面连接状态：初始检测 / 恢复中 / 已就绪 / 需用户操作 -->
      <div class="page-status is-checking" id="pageStatus" role="status">
        <span class="status-dot" id="pageStatusDot" aria-hidden="true"></span>
        <span class="status-text" id="pageStatusText">正在检测页面…</span>
        <button type="button" id="reconnectBtn" class="reconnect-btn" hidden>重新连接</button>
      </div>

      <fieldset id="sidebarPageActions" class="sidebar-page-actions" aria-label="网页填写">
      <button id="fillBtn" class="btn btn-primary btn-block btn-lg" title="识别页面表单并一键填入标准字段">
        <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
        </svg>
        <span class="btn-text">一键填入</span>
      </button>

      <div class="actions-row">
        <button id="aiFillBtn" class="btn btn-accent" title="先快速填入标准字段，再用 AI 解答开放题与主观题">
          <svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path>
          </svg>
          <span class="btn-text">AI 助填</span>
        </button>
        <button id="regionFillBtn" class="btn btn-soft" title="框选页面一段区域，把一条经历批量填入：左键拖框、右键取消当前框、Esc 退出、Ctrl/Command 拖出多个框">
          <svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3h5M16 3h5v5M21 16v5h-5M8 21H3v-5"></path>
            <rect x="8" y="8" width="8" height="8" rx="1"></rect>
          </svg>
          <span class="btn-text">选区填入</span>
        </button>
        <button id="incrementalFillBtn" class="btn btn-soft" title="只填当前为空的字段，不覆盖已填内容">
          <svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          <span class="btn-text">增量填入</span>
        </button>
      </div>
      <label class="sidebar-add-rows"><input id="incrementalAddRows" type="checkbox"> 增量填入时也补建条目</label>
      </fieldset>

      <button id="settingsBtn" class="btn btn-secondary btn-block" title="打开我的简历">
        <svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span class="btn-text">配置资料与简历</span>
      </button>
    </section>

    <div id="taskFeedback" class="task-feedback" role="status" hidden>
      <span class="tf-indicator" aria-hidden="true"></span>
      <span id="taskFeedbackText" class="tf-text"></span>
    </div>
    <details class="sidebar-details" id="sidebarDetails" hidden>
      <summary>查看待核对字段</summary>
      <ul></ul>
      <a href="../options/options.html#help-controls" data-workspace-link>下拉框与地区填写说明 ↗</a>
    </details>
    <div class="sidebar-task-controls" id="sidebarTaskControls" hidden>
      <button type="button" id="sidebarPause" class="btn btn-soft">暂停</button>
      <button type="button" id="sidebarCancel" class="btn btn-soft">取消任务</button>
    </div>
    <section id="sidebarResult" class="sidebar-result" hidden>
      <p>请在招聘网站核对填写结果。想跟进这个岗位，可以把它记到工作台。</p>
      <button type="button" id="captureResultBtn" class="btn btn-secondary">记录此岗位</button>
    </section>

    <section class="card sidebar-quick" aria-labelledby="quickHeading">
      <div class="sidebar-quick-head">
        <div><span class="sidebar-kicker">手动补填</span><h1 id="quickHeading">资料速查</h1></div>
        <a href="../options/options.html#help-quick" data-workspace-link class="footer-link">使用说明 ↗</a>
      </div>
      <div id="quickTarget" class="sidebar-target" aria-live="polite">
        <strong>先选一个网页字段</strong><span>点击网页输入框，或用 Tab 移到该字段。</span>
      </div>
      <label class="sidebar-search">
        <span class="sidebar-kicker">查找当前简历资料</span>
        <input id="quickSearch" type="search" placeholder="搜索字段或内容，例如「毕业院校」">
      </label>
      <div id="quickCategories" class="sidebar-categories" aria-label="资料分类">
        <button type="button" data-quick="basic" aria-pressed="true">基础与家属</button>
        <button type="button" data-quick="edu" aria-pressed="false">教育与科研</button>
        <button type="button" data-quick="exp" aria-pressed="false">经历与实战</button>
        <button type="button" data-quick="qa" aria-pressed="false">问答与自述</button>
      </div>
      <div class="sidebar-quick-tools">
        <label><input id="quickAll" type="checkbox"> 显示停用模块资料</label>
        <span>停用资料可复制</span>
      </div>
      <p id="quickNotice" class="sidebar-notice" role="status"></p>
      <div id="quickResults" class="sidebar-quick-results"></div>
    </section>
    <dialog id="quickEntryPreview" class="sidebar-preview" aria-labelledby="quickEntryHeading">
      <h2 id="quickEntryHeading">预览整条填入</h2>
      <p></p><ul></ul>
      <form method="dialog"><button value="cancel">取消</button><button value="write">确认填入</button></form>
    </dialog>

    <footer class="footer-bar">
      <button type="button" id="highlightBtn" class="btn btn-soft">字段高亮</button>
      <a href="../options/options.html#section-parser" data-workspace-link class="footer-link">HR 打招呼语 ↗</a>
      <a href="../options/options.html#settings-backup" data-workspace-link class="footer-link">数据备份与恢复 ↗</a>
    </footer>

  </div>

  <script src="../scripts/profile-schema.js"></script>
  <script src="../scripts/content/profile-catalog.js"></script>
  <script src="../scripts/storage.js"></script>
  <script src="../scripts/profile-create-dialog.js"></script>
  <script src="../scripts/profile-completeness.js"></script>
  <script src="../scripts/content-ready.js"></script>
  <script src="sidebar.js"></script>
  <script src="popup.js"></script>
</body>
</html>
