<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">易offer 架构与数据流</title>
  <desc id="diagram-description">易offer 与招聘网页交互，在浏览器本地读写简历、附件和投递记录。启用并使用 AI 功能时，扩展向配置的模型接口发送相关数据。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .title { font-size: 14px; font-weight: 600; fill: #1e293b; }
      .body { font-size: 12px; fill: #475569; }
      .small { font-size: 11px; fill: #475569; }
      .blue { fill: #1e40af; }
      .green { fill: #065f46; }
      .card { stroke-width: 1.5; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 4; marker-end: url(#arrowhead); }
      .solid-arrow { fill: none; stroke: #3b82f6; stroke-width: 1.5; marker-end: url(#arrowhead-blue); }
    </style>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 6,3 0,6" fill="#3b82f6" />
    </marker>
  </defs>

  <rect width="840" height="280" rx="14" fill="#ffffff" />
  <rect x="10" y="10" width="600" height="260" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <text class="body" x="25" y="32" font-weight="700">用户本地浏览器 · CHROMIUM</text>

  <rect class="card" x="30" y="55" width="165" height="195" rx="8" fill="#ffffff" stroke="#cbd5e1" />
  <text class="title" x="45" y="80">招聘网站 / ATS</text>
  <text class="body" x="45" y="102">• OfferLink / 北森</text>
  <text class="body" x="45" y="122">• Moka</text>
  <text class="body" x="45" y="142">• 小红书招聘</text>
  <text class="body" x="45" y="162">• BOSS / 猎聘沟通</text>
  <rect x="45" y="180" width="135" height="52" rx="4" fill="#f1f5f9" />
  <text class="small" x="54" y="201">DOM 识别</text>
  <text class="small" x="54" y="219">受控组件事件派发</text>

  <path class="solid-arrow" d="M 195 120 H 245" />
  <path class="solid-arrow" d="M 245 160 H 195" />

  <rect class="card" x="245" y="55" width="170" height="195" rx="8" fill="#ffffff" stroke="#3b82f6" />
  <text class="title blue" x="260" y="80">易offer 扩展</text>
  <text class="body" x="260" y="102">• 浏览器原生侧栏</text>
  <text class="body" x="260" y="122">• 表单匹配与填写</text>
  <text class="body" x="260" y="142">• 选区填入与资料速查</text>
  <text class="body" x="260" y="162">• 求职工作台</text>
  <rect x="260" y="180" width="140" height="52" rx="4" fill="#eff6ff" />
  <text class="small blue" x="269" y="201">原生 JS · 无需构建</text>
  <text class="small blue" x="269" y="219">PDF.js 本地文本提取</text>

  <path class="solid-arrow" d="M 415 126 H 455" />
  <path class="solid-arrow" d="M 455 154 H 415" />

  <rect class="card" x="455" y="55" width="140" height="195" rx="8" fill="#ecfdf5" stroke="#10b981" />
  <text class="title green" x="470" y="80">本地数据存储</text>
  <text class="body green" x="470" y="105">chrome.storage.local</text>
  <text class="small" x="470" y="123">简历、投递记录和设置</text>
  <text class="body green" x="470" y="145">IndexedDB</text>
  <text class="small" x="470" y="163">简历附件与照片</text>
  <rect x="468" y="180" width="115" height="52" rx="4" fill="#ffffff" stroke="#a7f3d0" />
  <text class="small green" x="477" y="201">Web Locks</text>
  <text class="small" x="477" y="219">串行更新投递记录</text>

  <path class="arrow" d="M 330 250 V 262 H 627 V 143 H 645" />

  <rect class="card" x="645" y="55" width="180" height="125" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 4" />
  <text class="title" x="660" y="80">大模型服务 · 可选</text>
  <text class="body" x="660" y="105">• DeepSeek / 通义千问</text>
  <text class="body" x="660" y="125">• 智谱 / Kimi / 豆包</text>
  <text class="body" x="660" y="145">• OpenAI / Gemini 等</text>
  <text class="small" x="660" y="203">启用并使用 AI 功能时</text>
  <text class="small" x="660" y="221">相关资料发往配置的接口</text>
</svg>
